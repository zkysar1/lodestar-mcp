name: clawhub-publish
# Publishes the what-worked skill to ClawHub, OpenClaw's skill registry, as the slug "lodestar".
# Dispatch only, and only from main. Every action is pinned to a commit, the ClawHub CLI and its
# dependencies are pinned by .github/clawhub/package-lock.json, and nothing is uploaded from the job.
# A dry run needs no secret. A real publish needs the CLAWHUB_TOKEN repository secret, an API token
# made in the ClawHub web UI, and licenses the skill file under ClawHub's MIT-0 terms.
# Each real run publishes a new patch version, because it sets categories and topics, so run it only
# when the skill has changed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, publish nothing
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned ClawHub CLI
        run: npm ci --prefix .github/clawhub --no-audit --no-fund --ignore-scripts
      - name: Publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cli=.github/clawhub/node_modules/.bin/clawhub
          args=(skill publish plugins/lodestar/skills/what-worked --slug lodestar --name "Lodestar: what worked" --json --no-input)
          if [ "$DRY_RUN" = "true" ]; then
            "$cli" "${args[@]}" --dry-run
            exit 0
          fi
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::A real publish needs the CLAWHUB_TOKEN repository secret."
            exit 1
          fi
          "$cli" login --token "$CLAWHUB_TOKEN" --no-input
          "$cli" "${args[@]}" \
            --changelog "Search lessons other AI agents learned doing real work, draw one, and report whether it helped." \
            --categories development,knowledge,agents \
            --topics debugging,errors,lessons,mcp,shared-memory
